<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #e8e8e8;
        font: 12px/1.2 'Helvetica Neue', Helvetica, Arial, sans-serif;
        color: #222;
        padding: 8px;
      }
      .matrix {
        display: grid;
        grid-template-columns: 88px 1fr 1fr;
        grid-template-rows: 18px auto auto;
        gap: 6px 8px;
        align-items: center;
        width: max-content;
      }
      .col-label {
        text-align: center;
        font-size: 11px;
        color: #333;
      }
      .row-label {
        font-size: 11px;
        color: #333;
        text-align: right;
        padding-right: 4px;
        max-width: 88px;
      }
      /* Match Federated Wiki site footer look */
      .footer {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #3a3a3a;
        color: #ccc;
        font: 13px/28px 'Helvetica Neue', Helvetica, Arial, sans-serif;
        padding: 0 8px;
        height: 28px;
        white-space: nowrap;
      }
      .footer #site-owner {
        text-transform: none;
      }
      .footer img {
        display: inline-block;
        height: 18px;
        width: 18px;
        vertical-align: text-bottom;
      }
      .footer .notOwner {
        transform: rotate(20deg);
      }
      .pair {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      .pair figure {
        margin: 0;
        text-align: center;
      }
      .pair figcaption {
        font-size: 10px;
        color: #444;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div class="matrix" id="shot">
      <div></div>
      <div class="col-label">unclaimed</div>
      <div class="col-label">claimed</div>

      <div class="row-label">unauthenticated</div>
      <div class="footer">
        <img src="../../client/key.svg" alt="key" />
      </div>
      <div class="footer">
        <span id="site-owner">Wiki by: Ward</span>
        <img src="../../client/lock.svg" alt="lock" />
      </div>

      <div class="row-label">authenticated</div>
      <div class="footer">
        <img src="../../client/key.svg" alt="key" />
      </div>
      <div class="pair">
        <figure>
          <div class="footer">
            <span id="site-owner">Wiki by: Ward</span>
            <img src="../../client/lock_open.svg" alt="open lock" />
          </div>
          <figcaption>owner</figcaption>
        </figure>
        <figure>
          <div class="footer">
            <span id="site-owner">Wiki by: Ward</span>
            <img class="notOwner" src="../../client/lock.svg" alt="tilted lock" />
          </div>
          <figcaption>peer</figcaption>
        </figure>
      </div>
    </div>
  </body>
</html>
